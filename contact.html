<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 30px;
      color: #333;
    }

    section {
      width: 80%;
      max-width: 500px;
      margin: 0 auto;
    }

    .contact-form {
      margin-top: 20px;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin : 50px auto;
    }

    .contact-form h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #333;
      display: flex;
      justify-content: center;
    }

    input, textarea {
      width: 95%;
      padding: 10px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      border-radius: 5px;
      font-size: 16px;
    }

    input[type="submit"] {
      background-color: #000;
      color: #fff;
      font-size: 18px;
      padding: 12px 20px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }

    input[type="submit"]:hover {
      background-color: #333;
    }

    .radio, .checkbox {
      margin-bottom: 10px;
      justify-content: start;
    }

    .selection {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      border-radius: 5px;
      font-size: 16px;
    }

    .selection option {
      font-size: 16px;
    }

    .radio label, .checkbox label {
      display: inline-block;
      font-size: 16px;
      margin-right: 15px;
      cursor: pointer;
      text-align: left;
    }

    .contact-info {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
      margin-top: 20px;
    }

    .contact-info h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #333;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      margin-bottom: 10px;
      font-size: 16px;
    }

  </style>
</head>
<body>
   <section class="contact-info">
      <h2>Contact Information</h2>
      <ul>
        <li>Address: Jalan Raya Renon, Denpasar, Bali </li>
        <li>Telephone: (013) 96986499</li>
        <li>Email: dummy@gmail.com</li>
      </ul>
    </section>
  <main>

    <section class="contact-form">
      <h2>Contact Form</h2>
      <form action="mailto:info@example.com" method="post">
        <input type="text" name="nama" placeholder="Name" required>
        <input type="password" name="password" placeholder="Password" required>
        <textarea name="pesan" placeholder="Message" required style="resize: none; height: 120px;"></textarea>

        <div class="radio">
          <h3>Gender:</h3>
          <label><input type="radio" name="jenis_kelamin" value="laki-laki" required> Male</label>
          <label><input type="radio" name="jenis_kelamin" value="perempuan" required> Female</label>
        </div>

        <div class="checkbox">
          <label><input type="checkbox" name="newsletter" value="ya" style="margin-left: 10px;"> I want to subscribe to the newsletter</label>
        </div>

          <label for="kategori" style="margin-left: 10px;">Category:</label>
          <select id="kategori" name="kategori" required>
            <option value="pertanyaan">Question</option>
            <option value="keluhan">Complaint</option>
            <option value="saran">Advice</option>
          </select>
          <br><br>
        <input type="submit" value="SEND">
      </form>
    </section>

   
  </main>
</body>
</html>
